[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["characters/migrations", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "DJ",   # flake8-django
    "SIM",  # simplify
    "RET",  # return style
    "ARG",  # unused arguments
    "TID",  # tidy imports
]
ignore = [
    "ARG002",  # unused method arguments: DRF hook signatures are fixed
]

[tool.ruff.lint.per-file-ignores]
"characters/tests/*" = ["ARG001", "ARG005"]

[tool.ruff.lint.isort]
known-first-party = ["ai_Influencer", "characters"]
