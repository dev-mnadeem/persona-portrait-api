services:
  api:
    build: .
    image: persona-portrait-api:local
    ports:
      - "7171:8000"
    environment:
      # Defaults to the offline provider: `docker compose up` needs no key.
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env before starting}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
    volumes:
      - portrait-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  portrait-data:
